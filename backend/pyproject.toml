[tool.ruff]
target-version = "py311"
line-length = 120
# Alembic generates migrations/versions/*.py from its own template
# (script.py.mako) - not code this project's style conventions apply to,
# and re-formatting a generated migration on every `alembic revision`
# would just be noise to review.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# Keep this small on purpose — don't fight the existing style, just catch
# real problems (unused imports/names, undefined names, obviously broken
# code) and import ordering.
select = ["E", "F", "I"]
